apiVersion: v1
kind: ConfigMap
metadata:
  name: payment
data:
  CART_HOST: "cart"
  CART_PORT: "8080"
  USER_HOST: "user"
  USER_PORT: "8080"
  AMQP_HOST: "rabbitmq"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels:
    project: roboshop
    tier: backend
    component: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      tier: backend
      component: payment
  template:
    metadata:
      labels:
        project: roboshop
        tier: backend
        component: payment
    spec:  
      containers:
        - name: payment
          image: joindevops/payment:4.0.0
          envFrom:
            - configMapRef:
                name: payment
                
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  labels:
    project: roboshop
    tier: backend
    component: payment
spec:
  type: NodePort
  selector:
    project: roboshop
    tier: backend
    component: payment
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      #nodePort: 30008
 
  