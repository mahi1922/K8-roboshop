apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels: 
    project: roboshop
    tier: db
    component: rabbitmq
  spec:
    replicas: 1
    selector:
      matchLabels:
        project: roboshop
        tier: db
        component: rabbitmq
    template:
      metadata:
        labels:
          project: roboshop
          tier: db
          component: rabbitmq
      spec:
        containers:
          - name: rabbitmq
            image: rabbitmq:3
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    project: roboshop
    tier: db
    component: rabbitmq
spec:
  selector:
    project: roboshop
    tier: db
    component: rabbitmq
  ports:
    - protocol: TCP
      port: 5672  #service port
      targetPort: 5672 #container port
  
