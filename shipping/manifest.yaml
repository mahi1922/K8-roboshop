apiVersion: v1
kind: ConfigMap
metadata:
  name: shipping
data:
  CART_ENDPOINT: "cart:8080"
  DB_HOST: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  labels:
    project: roboshop
    tier: backend
    component: shipping
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      tier: backend
      component: shipping
  template:
    metadata:
      labels:
        project: roboshop
        tier: backend
        component: shipping
    spec:  
      containers:
        - name: shipping
          image: joindevops/shipping:4.0.0
          envFrom:
            - configMapRef:
                name: shipping
                
---
apiVersion: v1
kind: Service
metadata:
  name: shipping
  labels:
    project: roboshop
    tier: backend
    component: shipping
spec:
  type: NodePort
  selector:
    project: roboshop
    tier: backend
    component: shipping
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      #nodePort: 30008
 
  